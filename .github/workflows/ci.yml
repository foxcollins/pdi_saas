name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP tests + lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pdi_saas_test
          POSTGRES_USER: pdi
          POSTGRES_PASSWORD: pdi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdi -d pdi_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pdi_saas_test
      DB_USERNAME: pdi
      DB_PASSWORD: pdi
      DB_RLS_USERNAME: app_tenant
      DB_RLS_PASSWORD: app_tenant
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:cuJg6L2MkDRrGAMMyD4Je2sOPyoHXhguF73MyBzlrEo=
      AI_DEFAULT_PROVIDER: fake
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CACHE_STORE: array
      BROADCAST_CONNECTION: log
      MAIL_MAILER: array
      VITE_PUSHER_APP_KEY: local
      VITE_PUSHER_APP_CLUSTER: mt1

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, bcmath, mbstring, intl, gd, zip
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint with Pint
        run: vendor/bin/pint --test

      - name: Prepare .env
        run: cp .env.example .env

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Run test suite
        run: php artisan test
